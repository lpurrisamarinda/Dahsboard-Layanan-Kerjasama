<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Jadwal Siaran & Kemitraan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
/* ── Reset & Variables ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0f1523;
  --bg2:      #161d2f;
  --bg3:      #1c2540;
  --surface:  #1e2a42;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --text:     #e8eaf0;
  --text2:    #8b93a8;
  --text3:    #5a6478;
  --blue:     #3b82f6;
  --blue2:    #2563eb;
  --bluebg:   rgba(59,130,246,0.12);
  --green:    #10b981;
  --greenbg:  rgba(16,185,129,0.12);
  --amber:    #f59e0b;
  --amberbg:  rgba(245,158,11,0.12);
  --red:      #ef4444;
  --redbg:    rgba(239,68,68,0.12);
  --purple:   #8b5cf6;
  --purplebg: rgba(139,92,246,0.12);
  --r:        10px;
  --r2:       8px;
  --sidebar:  240px;
  --font:     'Plus Jakarta Sans', system-ui, sans-serif;
  --mono:     'JetBrains Mono', monospace;
}
html, body { height: 100%; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
button { font-family: var(--font); cursor: pointer; }
input, select, textarea { font-family: var(--font); }
a { color: var(--blue); text-decoration: none; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

/* ── Utility ── */
.hidden { display: none !important; }
.sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

/* ══════════════════════════════════════════
   LOGIN PAGE
══════════════════════════════════════════ */
#loginPage {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at 60% 40%, rgba(37,99,235,0.15) 0%, transparent 60%), var(--bg);
}
.login-card {
  width: 380px;
  background: var(--bg2);
  border: 0.5px solid var(--border2);
  border-radius: 16px;
  padding: 40px 36px;
}
.login-logo {
  text-align: center;
  margin-bottom: 32px;
}
.login-logo .icon-wrap {
  width: 56px; height: 56px;
  background: var(--bluebg);
  border: 0.5px solid rgba(59,130,246,0.3);
  border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 26px; color: var(--blue);
  margin-bottom: 14px;
}
.login-logo h1 { font-size: 18px; font-weight: 600; color: var(--text); }
.login-logo p { font-size: 12px; color: var(--text2); margin-top: 4px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
.form-input {
  width: 100%; padding: 10px 14px;
  background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: var(--r2); color: var(--text); font-size: 14px; outline: none;
  transition: border-color .15s;
}
.form-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.form-input::placeholder { color: var(--text3); }
.btn-login {
  width: 100%; padding: 11px;
  background: var(--blue2); border: none; border-radius: var(--r2);
  color: #fff; font-size: 14px; font-weight: 600;
  margin-top: 8px; transition: background .15s;
}
.btn-login:hover { background: #1d4ed8; }
.login-hint {
  margin-top: 20px; padding: 12px 14px;
  background: var(--bg3); border-radius: var(--r2);
  font-size: 11px; color: var(--text2); line-height: 1.6;
}
.login-error {
  background: var(--redbg); border: 0.5px solid rgba(239,68,68,0.3);
  border-radius: var(--r2); padding: 10px 14px;
  font-size: 12px; color: #fca5a5; margin-bottom: 16px;
}

/* ══════════════════════════════════════════
   MAIN APP LAYOUT
══════════════════════════════════════════ */
#app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar);
  background: var(--bg2);
  border-right: 0.5px solid var(--border);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  transition: width .2s;
}
.sidebar-head {
  padding: 20px 18px 16px;
  border-bottom: 0.5px solid var(--border);
}
.sidebar-brand { font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; }
.sidebar-name { font-size: 14px; font-weight: 600; color: var(--text); margin-top: 3px; }
nav { padding: 12px 10px; flex: 1; overflow-y: auto; }
.nav-section { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; padding: 14px 8px 5px; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--r2);
  color: var(--text2); cursor: pointer; transition: all .15s;
  margin-bottom: 1px; font-size: 13px; font-weight: 500;
  border: none; background: transparent; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--bg3); color: var(--text); }
.nav-item.active { background: var(--bluebg); color: var(--blue); }
.nav-item i { font-size: 17px; width: 20px; text-align: center; flex-shrink: 0; }
.sidebar-footer {
  padding: 14px 16px;
  border-top: 0.5px solid var(--border);
}
.user-row { display: flex; align-items: center; gap: 10px; }
.user-avatar {
  width: 32px; height: 32px; border-radius: 8px;
  background: var(--bluebg); border: 0.5px solid rgba(59,130,246,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; color: var(--blue); flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; color: var(--text); }
.user-role { font-size: 11px; color: var(--text3); }
.btn-logout {
  margin-left: auto; background: transparent; border: none;
  color: var(--text3); font-size: 18px; padding: 4px; border-radius: 6px;
  transition: color .15s;
}
.btn-logout:hover { color: var(--red); }

/* ── Main Content ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: 56px; padding: 0 24px;
  background: var(--bg2); border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.page-title { font-size: 15px; font-weight: 600; color: var(--text); }
.alert-badge {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--amberbg); border: 0.5px solid rgba(245,158,11,0.3);
  color: var(--amber); font-size: 11px; font-weight: 500;
  padding: 4px 10px; border-radius: 20px; cursor: pointer;
}
.topbar-right { display: flex; align-items: center; gap: 10px; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--r2); font-size: 12px; font-weight: 500;
  border: 0.5px solid var(--border2); background: var(--bg3); color: var(--text);
  transition: all .15s; cursor: pointer;
}
.btn:hover { background: var(--surface); border-color: var(--border2); }
.btn-primary { background: var(--blue2); border-color: var(--blue2); color: #fff; }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
.btn-danger { background: var(--redbg); border-color: rgba(239,68,68,0.3); color: var(--red); }
.btn-danger:hover { background: rgba(239,68,68,0.2); }
.btn-sm { padding: 5px 10px; font-size: 11px; }
.btn-icon { padding: 6px; border-radius: 7px; }

.content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Metric Cards ── */
.metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 24px; }
.metric-card {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--r); padding: 18px;
  position: relative; overflow: hidden;
}
.metric-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
}
.metric-card.blue::before { background: var(--blue); }
.metric-card.green::before { background: var(--green); }
.metric-card.amber::before { background: var(--amber); }
.metric-card.red::before { background: var(--red); }
.metric-icon {
  width: 34px; height: 34px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; margin-bottom: 14px;
}
.metric-icon.blue { background: var(--bluebg); color: var(--blue); }
.metric-icon.green { background: var(--greenbg); color: var(--green); }
.metric-icon.amber { background: var(--amberbg); color: var(--amber); }
.metric-icon.red { background: var(--redbg); color: var(--red); }
.metric-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 500; }
.metric-value { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
.metric-value.small { font-size: 18px; }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 6px; }

/* ── Alert Box ── */
.alert-box {
  background: var(--surface); border: 0.5px solid rgba(245,158,11,0.25);
  border-left: 3px solid var(--amber); border-radius: var(--r);
  padding: 16px 18px; margin-bottom: 24px;
}
.alert-title { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--amber); margin-bottom: 12px; }
.alert-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; background: var(--bg3); border-radius: var(--r2);
  margin-bottom: 6px;
}
.alert-item:last-child { margin-bottom: 0; }
.alert-name { font-size: 13px; font-weight: 500; color: var(--text); }
.alert-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
.days-pill {
  font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 20px; flex-shrink: 0;
}
.days-pill.urgent { background: var(--redbg); color: var(--red); }
.days-pill.warn { background: var(--amberbg); color: var(--amber); }

/* ── Section Header ── */
.section-hdr {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.section-title { font-size: 14px; font-weight: 600; color: var(--text); }

/* ── Panel / Card ── */
.panel {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  margin-bottom: 24px;
}
.panel:last-child { margin-bottom: 0; }

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  padding: 10px 16px; text-align: left;
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: .06em;
  background: var(--bg3); border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
}
tbody td {
  padding: 12px 16px; font-size: 13px; color: var(--text);
  border-bottom: 0.5px solid var(--border);
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: rgba(255,255,255,0.02); }
.td-mono { font-family: var(--mono); font-size: 11px; color: var(--text2); }
.td-bold { font-weight: 500; }
.td-meta { font-size: 11px; color: var(--text2); margin-top: 2px; }
.td-actions { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }

/* ── Chips / Badges ── */
.chip {
  display: inline-flex; align-items: center;
  padding: 3px 9px; border-radius: 20px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.chip-green { background: var(--greenbg); color: var(--green); }
.chip-blue { background: var(--bluebg); color: #93c5fd; }
.chip-amber { background: var(--amberbg); color: var(--amber); }
.chip-red { background: var(--redbg); color: #fca5a5; }
.chip-gray { background: rgba(255,255,255,0.06); color: var(--text2); }
.chip-purple { background: var(--purplebg); color: #c4b5fd; }

/* ── Toolbar / Search ── */
.toolbar { padding: 12px 16px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.search-box {
  flex: 1; min-width: 200px;
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: var(--r2); padding: 8px 12px;
}
.search-box input { background: transparent; border: none; outline: none; font-size: 13px; color: var(--text); flex: 1; }
.search-box input::placeholder { color: var(--text3); }
.search-box i { font-size: 16px; color: var(--text3); }
.filter-select {
  padding: 8px 12px; background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: var(--r2); color: var(--text); font-size: 12px; outline: none;
}

/* ── Tab Bar ── */
.tab-bar {
  display: flex; gap: 2px; padding: 4px;
  background: var(--bg3); border-radius: var(--r2);
}
.tab-btn {
  padding: 6px 16px; border-radius: 7px; border: none;
  font-size: 12px; font-weight: 500; background: transparent;
  color: var(--text2); transition: all .15s;
}
.tab-btn.active { background: var(--surface); color: var(--text); }

/* ── Week Calendar ── */
.week-nav {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px;
}
.week-label { font-size: 13px; font-weight: 600; color: var(--text); min-width: 180px; text-align: center; }
.week-grid { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r); overflow: hidden; }
.week-header { display: grid; background: var(--bg3); border-bottom: 0.5px solid var(--border); }
.week-header-cell {
  padding: 10px 6px; text-align: center;
  font-size: 11px; font-weight: 600; color: var(--text2);
  border-right: 0.5px solid var(--border);
}
.week-header-cell:last-child { border-right: none; }
.week-header-cell.today { color: var(--blue); }
.week-header-cell .day-num { font-size: 18px; font-weight: 600; display: block; margin-top: 2px; color: var(--text); }
.week-header-cell.today .day-num { color: var(--blue); }
.week-body { display: grid; }
.time-col { border-right: 0.5px solid var(--border); }
.time-slot { height: 52px; padding: 4px 8px; font-size: 10px; color: var(--text3); border-bottom: 0.5px solid var(--border); font-family: var(--mono); }
.day-col { border-right: 0.5px solid var(--border); min-height: 52px; padding: 3px; position: relative; }
.day-col:last-child { border-right: none; }
.prog-block {
  margin: 1px 0; border-radius: 5px; padding: 4px 7px;
  font-size: 10px; cursor: pointer; border-left: 2px solid transparent;
  transition: opacity .15s;
}
.prog-block:hover { opacity: .8; }
.prog-block .pname { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog-block .ptime { opacity: .7; margin-top: 1px; }
.pb-blue { background: rgba(59,130,246,0.15); color: #93c5fd; border-color: var(--blue); }
.pb-green { background: rgba(16,185,129,0.15); color: #6ee7b7; border-color: var(--green); }
.pb-amber { background: rgba(245,158,11,0.15); color: #fcd34d; border-color: var(--amber); }
.pb-purple { background: rgba(139,92,246,0.15); color: #c4b5fd; border-color: var(--purple); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--bg2); border: 0.5px solid var(--border2);
  border-radius: 14px; width: 520px; max-width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal-hdr {
  padding: 20px 24px 16px; border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg2);
}
.modal-title { font-size: 15px; font-weight: 600; color: var(--text); }
.modal-close {
  background: transparent; border: none; color: var(--text2);
  font-size: 22px; line-height: 1; padding: 2px; border-radius: 6px;
  transition: color .15s;
}
.modal-close:hover { color: var(--red); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px; border-top: 0.5px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--bg2);
}
.form-row { margin-bottom: 16px; }
.form-row:last-child { margin-bottom: 0; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.form-label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.form-ctrl {
  width: 100%; padding: 9px 12px;
  background: var(--bg3); border: 0.5px solid var(--border2);
  border-radius: var(--r2); color: var(--text); font-size: 13px; outline: none;
  transition: border-color .15s;
}
.form-ctrl:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
.form-ctrl::placeholder { color: var(--text3); }
textarea.form-ctrl { resize: vertical; min-height: 80px; }
.form-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
.form-error { font-size: 11px; color: var(--red); margin-top: 4px; }

/* ── Loader ── */
.loader {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; color: var(--text2); flex-direction: column; gap: 14px;
}
.spinner {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--border2); border-top-color: var(--blue);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; right: 24px; z-index: 999;
  background: var(--surface); border: 0.5px solid var(--border2);
  border-radius: var(--r); padding: 12px 16px;
  font-size: 13px; color: var(--text);
  display: flex; align-items: center; gap: 10px;
  transform: translateY(80px); opacity: 0;
  transition: all .3s;
  max-width: 320px;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.success { border-left: 3px solid var(--green); }
#toast.error { border-left: 3px solid var(--red); }
#toast.info { border-left: 3px solid var(--blue); }
#toast i { font-size: 18px; flex-shrink: 0; }
#toast.success i { color: var(--green); }
#toast.error i { color: var(--red); }
#toast.info i { color: var(--blue); }

/* ── Empty State ── */
.empty { text-align: center; padding: 48px 24px; color: var(--text2); }
.empty i { font-size: 40px; color: var(--text3); display: block; margin-bottom: 12px; }
.empty-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 6px; }

/* ── Responsive ── */
@media (max-width: 768px) {
  :root { --sidebar: 0px; }
  .sidebar { position: fixed; left: -240px; width: 240px; height: 100vh; z-index: 200; transition: left .2s; }
  .sidebar.open { left: 0; }
  .main { width: 100%; }
  .content { padding: 16px; }
  .topbar { padding: 0 16px; }
  .metrics-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row-2 { grid-template-columns: 1fr; }
  .week-grid { overflow-x: auto; }
}
</style>
</head>
<body>

<!-- ══ LOGIN PAGE ══ -->
<div id="loginPage">
  <div class="login-card">
    <div class="login-logo">
      <div class="icon-wrap"><i class="ti ti-radio"></i></div>
      <h1>Dashboard Kemitraan</h1>
      <p>Jadwal Siaran & PNBP / Non-PNBP</p>
    </div>
    <div id="loginError" class="login-error hidden"></div>
    <div class="form-group">
      <label for="loginUser">Username</label>
      <input id="loginUser" type="text" class="form-input" placeholder="Masukkan username..." autocomplete="username">
    </div>
    <div class="form-group">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" class="form-input" placeholder="Masukkan password..." autocomplete="current-password">
    </div>
    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <i class="ti ti-login" style="margin-right:6px"></i> Masuk
    </button>
    <div class="login-hint">
      <strong>Demo login:</strong><br>
      Admin: <code>admin</code> / <code>admin123</code><br>
      Viewer: <code>viewer</code> / <code>viewer123</code>
    </div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="app" class="hidden">

<script>
// ═══════════════════════════════════════════════
// CONFIG & STATE
// ═══════════════════════════════════════════════
const API = 'http://localhost:3001/api'; // Ganti sesuai URL server Anda
let token = localStorage.getItem('pnbp_token') || '';
let currentUser = JSON.parse(localStorage.getItem('pnbp_user') || 'null');
let modalAction = null; // { type, method, id }
let currentPage = 'dashboard';
let rekananTab = 'pnbp';
let weekOffset = 0;
let dashCache = null;

// ═══════════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.classList.add('hidden');
  if (!username || !password) { showLoginErr('Username dan password wajib diisi.'); return; }
  btn.disabled = true; btn.textContent = 'Memproses...';
  try {
    const res = await apiFetch('/auth/login', 'POST', { username, password }, false);
    token = res.token;
    currentUser = res.user;
    localStorage.setItem('pnbp_token', token);
    localStorage.setItem('pnbp_user', JSON.stringify(currentUser));
    initApp();
  } catch (e) {
    showLoginErr(e.message || 'Login gagal.');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="ti ti-login" style="margin-right:6px"></i> Masuk';
  }
}

function showLoginErr(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg; el.classList.remove('hidden');
}

function doLogout() {
  token = ''; currentUser = null;
  localStorage.removeItem('pnbp_token');
  localStorage.removeItem('pnbp_user');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

document.getElementById('loginPass').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ═══════════════════════════════════════════════
// API HELPER
// ═══════════════════════════════════════════════
async function apiFetch(path, method = 'GET', body = null, auth = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (auth && token) headers['Authorization'] = `Bearer ${token}`;
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detail = data.detail ? '\n' + (Array.isArray(data.detail) ? data.detail.join('\n') : data.detail) : '';
    throw new Error((data.error || 'Terjadi kesalahan.') + detail);
  }
  return data;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function initApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  // Set user info
  const u = currentUser;
  if (u) {
    document.getElementById('userName').textContent = u.nama || u.username;
    document.getElementById('userRole').textContent = u.role === 'admin' ? 'Administrator' : 'Viewer';
    document.getElementById('userAvatar').textContent = (u.nama || u.username).substring(0,2).toUpperCase();
    if (u.role !== 'admin') {
      document.getElementById('navSettings').style.display = 'none';
      document.getElementById('adminNavSection').style.display = 'none';
    }
  }
  // Mobile menu
  if (window.innerWidth <= 768) {
    document.getElementById('menuToggle').style.display = 'flex';
  }
  navigate('dashboard', document.querySelector('[data-page="dashboard"]'));
}

// Auto-init if token exists
if (token && currentUser) {
  initApp();
} else {
  document.getElementById('loginPage').classList.remove('hidden');
}

// ═══════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════
function navigate(page, el) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');

  const titles = { dashboard: 'Dashboard Utama', jadwal: 'Jadwal Siaran', rekanan: 'Manajemen Rekanan', settings: 'Pengaturan' };
  document.getElementById('pageTitle').textContent = titles[page] || page;

  const right = document.getElementById('topbarRight');
  right.innerHTML = '';

  if (page === 'dashboard') renderDashboard();
  else if (page === 'jadwal') renderJadwal();
  else if (page === 'rekanan') renderRekanan();
  else if (page === 'settings') renderSettings();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ═══════════════════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════════════════
async function renderDashboard() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="loader"><div class="spinner"></div><span>Memuat dashboard...</span></div>';
  try {
    const d = await apiFetch('/dashboard/summary');
    dashCache = d;
    const alerts = d.kontrak_hampir_berakhir || [];
    // Update alert badge
    if (alerts.length > 0) {
      document.getElementById('alertBadge').classList.remove('hidden');
      document.getElementById('alertCount').textContent = alerts.length;
    }
    const fmtRupiah = n => 'Rp ' + Math.round(n).toLocaleString('id-ID');
    c.innerHTML = `
      <div class="metrics-grid">
        <div class="metric-card blue">
          <div class="metric-icon blue"><i class="ti ti-radio"></i></div>
          <div class="metric-label">Program Aktif Minggu Ini</div>
          <div class="metric-value">${d.program_aktif_minggu_ini}</div>
          <div class="metric-sub">${d.program_hari_ini} program hari ini</div>
        </div>
        <div class="metric-card green">
          <div class="metric-icon green"><i class="ti ti-cash"></i></div>
          <div class="metric-label">Total Nilai PNBP Berjalan</div>
          <div class="metric-value small">${fmtRupiah(d.total_nilai_pnbp)}</div>
          <div class="metric-sub">${d.mitra_pnbp} kontrak aktif</div>
        </div>
        <div class="metric-card amber">
          <div class="metric-icon amber"><i class="ti ti-users"></i></div>
          <div class="metric-label">Total Mitra Aktif</div>
          <div class="metric-value">${d.total_mitra_aktif}</div>
          <div class="metric-sub">${d.mitra_pnbp} PNBP · ${d.mitra_nonpnbp} Non-PNBP</div>
        </div>
        <div class="metric-card ${alerts.length > 0 ? 'red' : 'green'}">
          <div class="metric-icon ${alerts.length > 0 ? 'red' : 'green'}">
            <i class="ti ti-alert-circle"></i>
          </div>
          <div class="metric-label">Kontrak Hampir Berakhir</div>
          <div class="metric-value" style="color:var(--${alerts.length>0?'red':'green'})">${alerts.length}</div>
          <div class="metric-sub">Dalam 30 hari ke depan</div>
        </div>
      </div>

      ${alerts.length > 0 ? `
      <div class="alert-box" id="alertSection">
        <div class="alert-title"><i class="ti ti-alert-triangle"></i> Peringatan — Kontrak Hampir Berakhir (&le;30 hari)</div>
        ${alerts.map(r => `
          <div class="alert-item">
            <div>
              <div class="alert-name">${r.Nama_Instansi}</div>
              <div class="alert-meta">${r.ID_Rekanan} · ${r.tipe} · ${r.Status_Dokumen || ''} ${r.Nilai_Kontrak ? '· Rp ' + Number(r.Nilai_Kontrak).toLocaleString('id-ID') : ''}</div>
            </div>
            <span class="days-pill ${r.sisa_hari <= 7 ? 'urgent' : 'warn'}">${r.sisa_hari} hari lagi</span>
          </div>`).join('')}
      </div>` : ''}

      <div class="section-hdr">
        <div class="section-title">Siaran Hari Ini</div>
        <span style="font-size:12px;color:var(--text2)">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span>
      </div>
      <div class="panel">
        ${d.jadwal_hari_ini.length === 0
          ? '<div class="empty"><i class="ti ti-calendar-off"></i><div class="empty-title">Tidak ada jadwal hari ini</div></div>'
          : `<div class="table-wrap"><table>
              <thead><tr><th>Jam</th><th>Program</th><th>Jenis</th><th>Rekanan</th></tr></thead>
              <tbody>
                ${d.jadwal_hari_ini.map(j => `<tr>
                  <td class="td-mono">${j.Jam_Mulai} – ${j.Jam_Selesai}</td>
                  <td class="td-bold">${j.Nama_Program}</td>
                  <td><span class="chip ${j.Jenis_Siaran==='Rutin'?'chip-blue':'chip-amber'}">${j.Jenis_Siaran}</span></td>
                  <td>${j.ID_Rekanan || '<span style="color:var(--text3)">—</span>'}</td>

      </div>`;
  } catch (e) {
    c.innerHTML = `<div class="empty"><i class="ti ti-wifi-off"></i><div class="empty-title">Gagal memuat dashboard</div><p style="font-size:12px;color:var(--text2);margin-top:6px">${e.message}</p><button class="btn btn-primary" style="margin-top:16px" onclick="renderDashboard()">Coba Lagi</button></div>`;

}

function scrollToAlert() {
  const el = document.getElementById('alertSection');
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

// ═══════════════════════════════════════════════
// JADWAL
// ═══════════════════════════════════════════════
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const WARNA = { Rutin: 'pb-blue', Khusus: 'pb-amber', default: 'pb-purple' };

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay() === 0 ? 6 : today.getDay() - 1;
  const monday = new Date(today);
  monday.setDate(today.getDate() - dow + offset * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    return d;
  });
}

async function renderJadwal() {
  const c = document.getElementById('content');
  const isAdmin = currentUser?.role === 'admin';
  if (isAdmin) {
    document.getElementById('topbarRight').innerHTML = `
      <button class="btn btn-primary" onclick="openJadwalModal()">
        <i class="ti ti-plus"></i> Tambah Program
      </button>`;
  }
  c.innerHTML = '<div class="loader"><div class="spinner"></div><span>Memuat jadwal...</span></div>';
  try {
    const all = await apiFetch('/jadwal');
    const [allPNBP, allNonPNBP] = await Promise.all([apiFetch('/rekanan/pnbp'), apiFetch('/rekanan/non-pnbp')]);
    window._rekananList = [...allPNBP, ...allNonPNBP];
    renderJadwalView(all);
  } catch (e) {
    c.innerHTML = `<div class="empty"><i class="ti ti-wifi-off"></i><div class="empty-title">${e.message}</div></div>`;
  }
}

function renderJadwalView(all) {
  const c = document.getElementById('content');
  const isAdmin = currentUser?.role === 'admin';
  const dates = getWeekDates(weekOffset);
  const todayStr = new Date().toDateString();

  const weekLabel = `${dates[0].toLocaleDateString('id-ID',{day:'numeric',month:'short'})} – ${dates[6].toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}`;

  // Group jadwal by hari
  const byHari = {};
  HARI.forEach(h => byHari[h] = []);
  all.forEach(j => { if (byHari[j.Hari]) byHari[j.Hari].push(j); });

  const times = ['05:00','06:00','07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];

  c.innerHTML = `
    <div class="week-nav">
      <button class="btn btn-icon" onclick="weekOffset--;renderJadwal()"><i class="ti ti-chevron-left"></i></button>
      <span class="week-label">${weekLabel}</span>
      <button class="btn btn-icon" onclick="weekOffset++;renderJadwal()"><i class="ti ti-chevron-right"></i></button>
      <button class="btn btn-sm" onclick="weekOffset=0;renderJadwal()" style="margin-left:4px">Hari Ini</button>
    </div>
    <div class="week-grid" style="overflow-x:auto">
      <div class="week-header" style="grid-template-columns:72px repeat(7,1fr);min-width:700px">
        <div class="week-header-cell" style="border-bottom:0.5px solid var(--border)"></div>
        ${dates.map((d,i) => `
          <div class="week-header-cell ${d.toDateString()===todayStr?'today':''}">
            ${HARI[i].substring(0,3)}
            <span class="day-num">${d.getDate()}</span>
          </div>`).join('')}
      </div>
      <div class="week-body" style="grid-template-columns:72px repeat(7,1fr);min-width:700px">
        <div class="time-col">
          ${times.map(t=>`<div class="time-slot">${t}</div>`).join('')}
        </div>
        ${HARI.map(hari => `
          <div class="day-col">
            ${times.map(t=>`<div style="height:52px;border-bottom:0.5px solid var(--border)"></div>`).join('')}
            <div style="position:absolute;top:0;left:0;right:0;padding:3px">
              ${byHari[hari].map(j => {
                const cls = j.Jenis_Siaran === 'Rutin' ? 'pb-blue' : (j.ID_Rekanan ? 'pb-amber' : 'pb-purple');
                const rekNonPNBP = j.ID_Rekanan && j.ID_Rekanan.startsWith('NON') ? 'pb-green' : cls;
                return `<div class="prog-block ${rekNonPNBP}" onclick="editJadwal('${j.ID_Jadwal}', ${JSON.stringify(j).replace(/'/g,"&#39;")})">
                  <div class="pname">${j.Nama_Program}</div>
                  <div class="ptime">${j.Jam_Mulai}–${j.Jam_Selesai}</div>
                </div>`;
              }).join('')}
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>Rutin internal</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--amber)"></span>Khusus PNBP</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span>Non-PNBP / Barter</div>
      <div class="legend-item"><span class="legend-dot" style="background:var(--purple)"></span>Lainnya</div>
    </div>

    <div class="section-hdr" style="margin-top:24px">
      <div class="section-title">Daftar Semua Program</div>
      <span style="font-size:12px;color:var(--text2)">${all.length} program terdaftar</span>
    </div>
    <div class="panel">
      ${all.length===0?'<div class="empty"><i class="ti ti-calendar-plus"></i><div class="empty-title">Belum ada jadwal</div></div>':`
      <div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Hari</th><th>Jam</th><th>Program</th><th>Jenis</th><th>Rekanan</th>${isAdmin?'<th></th>':''}</tr></thead>
        <tbody>
          ${all.map(j=>`<tr>
            <td class="td-mono">${j.ID_Jadwal}</td>
            <td>${j.Hari}</td>
            <td class="td-mono">${j.Jam_Mulai}–${j.Jam_Selesai}</td>
            <td class="td-bold">${j.Nama_Program}</td>
            <td><span class="chip ${j.Jenis_Siaran==='Rutin'?'chip-blue':'chip-amber'}">${j.Jenis_Siaran}</span></td>
            <td>${j.ID_Rekanan||'<span style="color:var(--text3)">—</span>'}</td>
            ${isAdmin?`<td><div class="td-actions">
              <button class="btn btn-sm btn-icon" onclick="editJadwal('${j.ID_Jadwal}',${JSON.stringify(j).replace(/"/g,'&quot;')})"><i class="ti ti-edit"></i></button>
              <button class="btn btn-sm btn-icon btn-danger" onclick="deleteItem('jadwal','${j.ID_Jadwal}','${j.Nama_Program}')"><i class="ti ti-trash"></i></button>
            </div></td>`:''}
          </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

function openJadwalModal(data = null) {
  const isEdit = !!data;
  const rekList = window._rekananList || [];
  const rekOptions = `<option value="">— Siaran Internal —</option>
    <optgroup label="Rekanan PNBP">
      ${rekList.filter(r=>r.ID_Rekanan.startsWith('PNBP')).map(r=>`<option value="${r.ID_Rekanan}" ${data?.ID_Rekanan===r.ID_Rekanan?'selected':''}>${r.Nama_Instansi} (${r.ID_Rekanan})</option>`).join('')}
    </optgroup>
    <optgroup label="Rekanan Non-PNBP">
      ${rekList.filter(r=>r.ID_Rekanan.startsWith('NON')).map(r=>`<option value="${r.ID_Rekanan}" ${data?.ID_Rekanan===r.ID_Rekanan?'selected':''}>${r.Nama_Instansi} (${r.ID_Rekanan})</option>`).join('')}
    </optgroup>`;

  openModal(
    isEdit ? 'Edit Jadwal' : 'Tambah Jadwal Baru',
    `<div class="form-row">
      <label class="form-label">Nama Program *</label>
      <input id="fNama" class="form-ctrl" type="text" value="${data?.Nama_Program||''}" placeholder="Nama program siaran...">
    </div>
    <div class="form-row-2">
      <div>
        <label class="form-label">Hari *</label>
        <select id="fHari" class="form-ctrl">
          ${HARI.map(h=>`<option ${data?.Hari===h?'selected':''}>${h}</option>`).join('')}
        </select>
      </div>
      <div>
        <label class="form-label">Jenis Siaran *</label>
        <select id="fJenis" class="form-ctrl">
          <option ${data?.Jenis_Siaran==='Rutin'?'selected':''}>Rutin</option>
          <option ${data?.Jenis_Siaran==='Khusus'?'selected':''}>Khusus</option>
        </select>
      </div>
    </div>
    <div class="form-row-2">
      <div>
        <label class="form-label">Jam Mulai *</label>
        <input id="fMulai" class="form-ctrl" type="time" value="${data?.Jam_Mulai||'07:00'}">
      </div>
      <div>
        <label class="form-label">Jam Selesai *</label>
        <input id="fSelesai" class="form-ctrl" type="time" value="${data?.Jam_Selesai||'08:00'}">
      </div>
    </div>
    <div class="form-row">
      <label class="form-label">Rekanan (Opsional)</label>
      <select id="fRekanan" class="form-ctrl">${rekOptions}</select>
    </div>
    <div class="form-row">
      <label class="form-label">Keterangan</label>
      <textarea id="fKet" class="form-ctrl" rows="3" placeholder="Catatan tambahan...">${data?.Keterangan||''}</textarea>
    </div>`,
    { type: 'jadwal', method: isEdit ? 'PUT' : 'POST', id: data?.ID_Jadwal }
  );
}

function editJadwal(id, data) {
  if (currentUser?.role !== 'admin') return;
  openJadwalModal(data);
}

// ═══════════════════════════════════════════════
// REKANAN
// ═══════════════════════════════════════════════
async function renderRekanan() {
  const c = document.getElementById('content');
  const isAdmin = currentUser?.role === 'admin';
  document.getElementById('topbarRight').innerHTML = isAdmin ? `
    <button class="btn btn-primary" onclick="openRekananModal(rekananTab)">
      <i class="ti ti-plus"></i> Tambah Rekanan
    </button>` : '';
  c.innerHTML = '<div class="loader"><div class="spinner"></div><span>Memuat data rekanan...</span></div>';
  const [pnbp, nonpnbp] = await Promise.all([apiFetch('/rekanan/pnbp').catch(()=>[]), apiFetch('/rekanan/non-pnbp').catch(()=>[])]);
  renderRekananView(pnbp, nonpnbp);
}

function renderRekananView(pnbp, nonpnbp, searchQ = '', filterSt = '') {
  const c = document.getElementById('content');
  const isAdmin = currentUser?.role === 'admin';

  const fmtRupiah = n => n ? 'Rp ' + Number(n).toLocaleString('id-ID') : '—';
  const fmtDate = d => d ? new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '—';
  const statusChip = s => {
    if(s==='Aktif') return `<span class="chip chip-green">${s}</span>`;
    if(s==='Akan Berakhir') return `<span class="chip chip-amber">${s}</span>`;
    if(s==='Expired') return `<span class="chip chip-red">${s}</span>`;
    return '';
  };
  const dokChip = s => ({ MOU:'chip-blue', PKS:'chip-green', Proses:'chip-amber' })[s]||'chip-gray';
  const bayarChip = s => ({ Lunas:'chip-green', Termin:'chip-amber', 'Belum Bayar':'chip-red' })[s]||'chip-gray';

  let pList = pnbp;
  let nList = nonpnbp;
  if (searchQ) {
    const q = searchQ.toLowerCase();
    pList = pList.filter(r=>r.Nama_Instansi?.toLowerCase().includes(q)||r.PIC_Nama?.toLowerCase().includes(q));
    nList = nList.filter(r=>r.Nama_Instansi?.toLowerCase().includes(q)||r.PIC_Nama?.toLowerCase().includes(q));
  }
  if (filterSt) {
    pList = pList.filter(r=>r.status_kontrak===filterSt);
    nList = nList.filter(r=>r.status_kontrak===filterSt);
  }

  const pnbpTable = pList.length === 0
    ? '<div class="empty"><i class="ti ti-building-off"></i><div class="empty-title">Tidak ada data rekanan PNBP</div></div>'
    : `<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Instansi</th><th>PIC</th><th>Nilai Kontrak</th><th>Masa Berlaku</th><th>Status</th><th>Pembayaran</th><th>Dokumen</th>${isAdmin?'<th></th>':''}</tr></thead>
        <tbody>
          ${pList.map(r=>`<tr>
            <td class="td-mono">${r.ID_Rekanan}</td>
            <td class="td-bold">${r.Nama_Instansi}</td>
            <td>${r.PIC_Nama}<div class="td-meta">${r.PIC_Kontak}</div></td>
            <td style="font-family:var(--mono);font-size:12px">${fmtRupiah(r.Nilai_Kontrak)}</td>
            <td>${fmtDate(r.Tanggal_Mulai)}<div class="td-meta">s/d ${fmtDate(r.Tanggal_Berakhir)}</div></td>
            <td>${statusChip(r.status_kontrak)}</td>
            <td><span class="chip ${bayarChip(r.Status_Pembayaran)}">${r.Status_Pembayaran}</span></td>
            <td><span class="chip ${dokChip(r.Status_Dokumen)}">${r.Status_Dokumen}</span></td>
            ${isAdmin?`<td><div class="td-actions">
              <button class="btn btn-sm btn-icon" onclick="openRekananModal('pnbp',${JSON.stringify(r).replace(/"/g,'&quot;')})"><i class="ti ti-edit"></i></button>
              <button class="btn btn-sm btn-icon btn-danger" onclick="deleteItem('rekanan/pnbp','${r.ID_Rekanan}','${r.Nama_Instansi}')"><i class="ti ti-trash"></i></button>
            </div></td>`:''}
          </tr>`).join('')}
        </tbody>
      </table></div>`;

  const npTable = nList.length === 0
    ? '<div class="empty"><i class="ti ti-building-off"></i><div class="empty-title">Tidak ada data rekanan Non-PNBP</div></div>'
    : `<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Instansi</th><th>PIC</th><th>Bentuk Barter</th><th>Masa Berlaku</th><th>Status</th><th>Dokumen</th>${isAdmin?'<th></th>':''}</tr></thead>
        <tbody>
          ${nList.map(r=>`<tr>
            <td class="td-mono">${r.ID_Rekanan}</td>
            <td class="td-bold">${r.Nama_Instansi}</td>
            <td>${r.PIC_Nama}<div class="td-meta">${r.PIC_Kontak}</div></td>
            <td style="max-width:200px;white-space:normal">${r.Bentuk_Barter}</td>
            <td>${fmtDate(r.Tanggal_Mulai)}<div class="td-meta">s/d ${fmtDate(r.Tanggal_Berakhir)}</div></td>
            <td>${statusChip(r.status_kontrak)}</td>
            <td><span class="chip ${dokChip(r.Status_Dokumen)}">${r.Status_Dokumen}</span></td>
            ${isAdmin?`<td><div class="td-actions">
              <button class="btn btn-sm btn-icon" onclick="openRekananModal('nonpnbp',${JSON.stringify(r).replace(/"/g,'&quot;')})"><i class="ti ti-edit"></i></button>
              <button class="btn btn-sm btn-icon btn-danger" onclick="deleteItem('rekanan/non-pnbp','${r.ID_Rekanan}','${r.Nama_Instansi}')"><i class="ti ti-trash"></i></button>
            </div></td>`:''}
          </tr>`).join('')}
        </tbody>
      </table></div>`;

  c.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px">
      <div class="tab-bar">
        <button class="tab-btn ${rekananTab==='pnbp'?'active':''}" onclick="rekananTab='pnbp';renderRekananSearch()">PNBP (${pnbp.length})</button>
        <button class="tab-btn ${rekananTab==='nonpnbp'?'active':''}" onclick="rekananTab='nonpnbp';renderRekananSearch()">Non-PNBP (${nonpnbp.length})</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="search-box" style="min-width:220px">
          <i class="ti ti-search"></i>
          <input id="rekSearch" type="text" placeholder="Cari instansi atau PIC..." value="${searchQ}" oninput="renderRekananSearch()">
        </div>
        <select id="rekFilter" class="filter-select" onchange="renderRekananSearch()">
          <option value="">Semua status</option>
          <option value="Aktif" ${filterSt==='Aktif'?'selected':''}>Aktif</option>
          <option value="Akan Berakhir" ${filterSt==='Akan Berakhir'?'selected':''}>Akan Berakhir</option>
          <option value="Expired" ${filterSt==='Expired'?'selected':''}>Expired</option>
        </select>
      </div>
    </div>
    <div class="panel" id="pnbpPanel" ${rekananTab!=='pnbp'?'style="display:none"':''}>
      ${pnbpTable}
    </div>
    <div class="panel" id="nonpnbpPanel" ${rekananTab!=='nonpnbp'?'style="display:none"':''}>
      ${npTable}
    </div>`;

  window._pnbpData = pnbp;
  window._nonpnbpData = nonpnbp;
}

function renderRekananSearch() {
  const q = document.getElementById('rekSearch')?.value || '';
  const f = document.getElementById('rekFilter')?.value || '';
  renderRekananView(window._pnbpData||[], window._nonpnbpData||[], q, f);
  document.getElementById('pnbpPanel').style.display = rekananTab==='pnbp'?'':'none';
  document.getElementById('nonpnbpPanel').style.display = rekananTab==='nonpnbp'?'':'none';
}

function openRekananModal(type, data = null) {
  const isEdit = !!data;
  if (type === 'pnbp') {
    openModal(
      isEdit ? 'Edit Rekanan PNBP' : 'Tambah Rekanan PNBP',
      `<div class="form-row">
        <label class="form-label">Nama Instansi *</label>
        <input id="fInst" class="form-ctrl" value="${data?.Nama_Instansi||''}" placeholder="Nama instansi / perusahaan...">
      </div>
      <div class="form-row-2">
        <div><label class="form-label">Nama PIC *</label><input id="fPIC" class="form-ctrl" value="${data?.PIC_Nama||''}" placeholder="Nama penanggung jawab..."></div>
        <div><label class="form-label">Kontak PIC *</label><input id="fKontak" class="form-ctrl" type="tel" value="${data?.PIC_Kontak||''}" placeholder="08xx-xxxx-xxxx"></div>
      </div>
      <div class="form-row-2">
        <div><label class="form-label">Nilai Kontrak (Rp) *</label><input id="fNilai" class="form-ctrl" type="number" value="${data?.Nilai_Kontrak||''}" placeholder="0"></div>
        <div><label class="form-label">Nomor Kontrak</label><input id="fNomor" class="form-ctrl" value="${data?.Nomor_Kontrak||''}" placeholder="No. Kontrak..."></div>
      </div>
      <div class="form-row-2">
        <div><label class="form-label">Tanggal Mulai *</label><input id="fTMulai" class="form-ctrl" type="date" value="${data?.Tanggal_Mulai||''}"></div>
        <div><label class="form-label">Tanggal Berakhir *</label><input id="fTAkhir" class="form-ctrl" type="date" value="${data?.Tanggal_Berakhir||''}"></div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-label">Status Pembayaran *</label>
          <select id="fBayar" class="form-ctrl">
            ${['Lunas','Termin','Belum Bayar'].map(s=>`<option ${data?.Status_Pembayaran===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="form-label">Status Dokumen *</label>
          <select id="fDok" class="form-ctrl">
            ${['MOU','PKS','Proses'].map(s=>`<option ${data?.Status_Dokumen===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>`,
      { type: 'rekanan/pnbp', method: isEdit ? 'PUT' : 'POST', id: data?.ID_Rekanan }
    );
  } else {
    openModal(
      isEdit ? 'Edit Rekanan Non-PNBP' : 'Tambah Rekanan Non-PNBP',
      `<div class="form-row">
        <label class="form-label">Nama Instansi *</label>
        <input id="fInst" class="form-ctrl" value="${data?.Nama_Instansi||''}" placeholder="Nama instansi / organisasi...">
      </div>
      <div class="form-row-2">
        <div><label class="form-label">Nama PIC *</label><input id="fPIC" class="form-ctrl" value="${data?.PIC_Nama||''}" placeholder="Nama penanggung jawab..."></div>
        <div><label class="form-label">Kontak PIC *</label><input id="fKontak" class="form-ctrl" type="tel" value="${data?.PIC_Kontak||''}" placeholder="08xx-xxxx-xxxx"></div>
      </div>
      <div class="form-row">
        <label class="form-label">Bentuk Barter / Kompensasi *</label>
        <textarea id="fBarter" class="form-ctrl" rows="3" placeholder="Jelaskan bentuk kompensasi non-moneter...">${data?.Bentuk_Barter||''}</textarea>
      </div>
      <div class="form-row-2">
        <div><label class="form-label">Tanggal Mulai *</label><input id="fTMulai" class="form-ctrl" type="date" value="${data?.Tanggal_Mulai||''}"></div>
        <div><label class="form-label">Tanggal Berakhir *</label><input id="fTAkhir" class="form-ctrl" type="date" value="${data?.Tanggal_Berakhir||''}"></div>
      </div>
      <div class="form-row">
        <label class="form-label">Status Dokumen *</label>
        <select id="fDok" class="form-ctrl">
          ${['MOU','PKS','Proses'].map(s=>`<option ${data?.Status_Dokumen===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>`,
      { type: 'rekanan/non-pnbp', method: isEdit ? 'PUT' : 'POST', id: data?.ID_Rekanan }
    );
  }
}

      <div style="padding:20px 24px;border-bottom:0.5px solid var(--border)">
        <div class="section-title">Koneksi Google Sheets</div>

        <div class="form-row">
          <label class="form-label">Spreadsheet ID</label>
          <input class="form-ctrl" id="sFsId" placeholder="Masukkan ID dari URL spreadsheet...">
          <div class="form-hint">Salin dari URL: docs.google.com/spreadsheets/d/<strong>[ID INI]</strong>/edit</div>
        </div>
        <div class="form-row">

          <input class="form-ctrl" value="Jadwal_Siaran">

        </div>
        <div style="margin-top:8px;padding:14px;background:var(--bg3);border-radius:var(--r2);font-size:12px;color:var(--text2)">
          <strong style="color:var(--amber)"><i class="ti ti-info-circle" style="vertical-align:-2px"></i> Catatan:</strong>
          Perubahan konfigurasi ini harus dilakukan di file <code style="background:var(--bg);padding:2px 6px;border-radius:4px">.env</code> pada server backend,
          lalu restart server. Panduan lengkap tersedia di file <code style="background:var(--bg);padding:2px 6px;border-radius:4px">docs/SETUP.md</code>.
        </div>
      </div>
    </div>

    <div class="panel" style="max-width:560px;margin-top:20px">
      <div style="padding:20px 24px;border-bottom:0.5px solid var(--border)">
        <div class="section-title">Informasi Sistem</div>
      </div>
      <div style="padding:20px 24px">
        <table style="width:100%">
          <tr><td style="padding:8px 0;color:var(--text2);font-size:12px;width:160px">Versi Aplikasi</td><td style="font-size:13px">v1.0.0</td></tr>
          <tr><td style="padding:8px 0;color:var(--text2);font-size:12px">User Aktif</td><td style="font-size:13px">${currentUser?.nama} (${currentUser?.role})</td></tr>
          <tr><td style="padding:8px 0;color:var(--text2);font-size:12px">Backend API</td><td style="font-size:13px;font-family:var(--mono)">${API}</td></tr>
          <tr><td style="padding:8px 0;color:var(--text2);font-size:12px">Status Server</td>
            <td><button class="btn btn-sm" onclick="checkHealth(this)"><i class="ti ti-activity-heartbeat"></i> Cek Koneksi</button></td>
          </tr>
        </table>
      </div>
    </div>`;
}

async function checkHealth(btn) {
  btn.textContent = 'Memeriksa...';
  try {
    const r = await apiFetch('/health', 'GET', null, false);
    showToast('Server aktif: ' + r.timestamp, 'success');
  } catch (e) {
    showToast('Server tidak dapat dijangkau: ' + e.message, 'error');
  }
  btn.innerHTML = '<i class="ti ti-activity-heartbeat"></i> Cek Koneksi';
}

// ═══════════════════════════════════════════════
// MODAL & FORM SUBMIT
// ═══════════════════════════════════════════════
function openModal(title, bodyHtml, action) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalFooter').style.display = '';
  modalAction = action;
  document.getElementById('modal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  modalAction = null;
}

async function submitModal() {
  if (!modalAction) return;
  const btn = document.getElementById('modalSave');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    let body;
    if (modalAction.type === 'jadwal') {
      body = {
        Hari: document.getElementById('fHari').value,
        Jam_Mulai: document.getElementById('fMulai').value,
        Jam_Selesai: document.getElementById('fSelesai').value,
        Nama_Program: document.getElementById('fNama').value,
        Jenis_Siaran: document.getElementById('fJenis').value,
        ID_Rekanan: document.getElementById('fRekanan').value,
        Keterangan: document.getElementById('fKet').value,
      };
    } else if (modalAction.type === 'rekanan/pnbp') {
      body = {
        Nama_Instansi: document.getElementById('fInst').value,
        PIC_Nama: document.getElementById('fPIC').value,
        PIC_Kontak: document.getElementById('fKontak').value,
        Nilai_Kontrak: document.getElementById('fNilai').value,
        Nomor_Kontrak: document.getElementById('fNomor').value,
        Tanggal_Mulai: document.getElementById('fTMulai').value,
        Tanggal_Berakhir: document.getElementById('fTAkhir').value,
        Status_Pembayaran: document.getElementById('fBayar').value,
        Status_Dokumen: document.getElementById('fDok').value,
      };
    } else if (modalAction.type === 'rekanan/non-pnbp') {
      body = {
        Nama_Instansi: document.getElementById('fInst').value,
        PIC_Nama: document.getElementById('fPIC').value,
        PIC_Kontak: document.getElementById('fKontak').value,
        Bentuk_Barter: document.getElementById('fBarter').value,
        Tanggal_Mulai: document.getElementById('fTMulai').value,
        Tanggal_Berakhir: document.getElementById('fTAkhir').value,
        Status_Dokumen: document.getElementById('fDok').value,
      };
    }
    const url = modalAction.method === 'PUT'
      ? `/${modalAction.type}/${modalAction.id}`
      : `/${modalAction.type}`;
    await apiFetch(url, modalAction.method, body);
    showToast('Data berhasil disimpan!', 'success');
    closeModal();
    // Refresh halaman saat ini
    navigate(currentPage, document.querySelector(`[data-page="${currentPage}"]`));
  } catch (e) {
    showToast(e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan';
  }
}

async function deleteItem(type, id, name) {
  if (!confirm(`Hapus "${name}"?\n\nData ini akan dihapus permanen dari Google Sheets.`)) return;
  try {
    await apiFetch(`/${type}/${id}`, 'DELETE');
    showToast('Data berhasil dihapus.', 'success');
    navigate(currentPage, document.querySelector(`[data-page="${currentPage}"]`));
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ═══════════════════════════════════════════════
// TOAST
// ═══════════════════════════════════════════════
let toastTimer;
function showToast(msg, type = 'info') {
  const t = document.getElementById('toast');
  const icons = { success: 'ti-check', error: 'ti-x', info: 'ti-info-circle' };
  t.className = `show ${type}`;
  t.querySelector('i').className = `ti ${icons[type]||'ti-info-circle'}`;
  document.getElementById('toastMsg').textContent = msg;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3500);
}
</script>
